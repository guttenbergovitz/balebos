version: '3.8'

services:
  balebos:
    build: .
    container_name: balebos
    # stdin_open and tty are required to interact with the ratatui TUI!
    stdin_open: true
    tty: true
    volumes:
      # Persist JSONL inventory and Parquet analytics locally
      - ./data:/app/data
    environment:
      # Keeps probe tools from printing to stdout inside TUI
      - BALEBOS_STORAGE=hybrid
