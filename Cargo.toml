[package]
name = "balebos"
version = "0.3.0"
edition = "2021"
description = "System control layer that keeps infrastructure in a known, observable state"

[dependencies]
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }
regex = "1.10.2"
url = "2.5.8"
