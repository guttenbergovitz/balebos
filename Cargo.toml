[package]
name = "balebos"
version = "2.0.0-alpha.1"
edition = "2021"
description = "System control layer that keeps infrastructure in a known, observable state"

[dependencies]
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10.2"
ratatui = "0.30.0"
crossterm = "0.29.0"
isocountry = "0.3.2"
rayon = "1.11.0"
thiserror = "2.0"
csv = "1.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
parquet = { version = "60.2.0", features = ["arrow"], optional = true }
sha2 = "0.10"
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }


[features]
default = []
parquet-archive = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
