[package]
name = "balebos"
version = "1.3.0"
edition = "2021"
description = "System control layer that keeps infrastructure in a known, observable state"

[dependencies]
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "=0.4.37", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10.2"
ratatui = "0.30.0"
crossterm = "0.29.0"
isocountry = "0.3.2"
rayon = "1.11.0"
thiserror = "2.0"
datafusion = { version = "40.0", default-features = false }
parquet = "52.0"
arrow = "52.0"
polars = { version = "0.40", features = ["lazy", "parquet"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[features]
default = []
